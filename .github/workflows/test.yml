name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Unit and fuzz tests
        run: forge test --no-match-contract ForkV4 -vv

      - name: Fork tests against Robinhood Chain
        run: forge test --match-contract ForkV4 --fork-url robinhood -vv
